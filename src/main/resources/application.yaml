spring:
  application:
    name: aicode-backend
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/aicode
    username: postgres
    password: 123456

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: default
      paths-to-match: /**
      packages-to-scan: com.bottlecap.aicode.controller

knife4j:
  enable: true
  setting:
    language: zh_cn
